<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dog's Dungeon Fucker Upper</title>
<meta name="description" content="Spin for a Destiny 2 dungeon modifier.">
<meta name="theme-color" content="#0d0f14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --panel: #161a22;
    --line: #2a303c;
    --text: #e8e6e1;
    --muted: #8b909c;
    --accent: #e8a33d;
    --accent-2: #c2412d;
  }
  * { box-sizing: border-box; }
  body > * { flex-shrink: 0; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 50% -10%, #2a1d12 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    min-height: 100dvh;
  }
  header { text-align: center; margin-bottom: 28px; }
  h1 {
    font-family: Oswald, sans-serif; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; font-size: clamp(26px, 7vw, 44px); line-height: 1.05; margin: 0;
  }
  h1 span { color: var(--accent); }

  .card {
    width: 100%; max-width: 520px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 28px 20px; text-align: center; position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
  }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  .result {
    font-family: Oswald, sans-serif; font-weight: 700;
    font-size: clamp(28px, 8vw, 42px); line-height: 1.1;
    min-height: 2.3em; display: flex; align-items: center; justify-content: center;
    margin: 14px 0 6px; transition: color .2s;
  }
  .result.spinning { color: var(--muted); }
  .result.landed { color: var(--accent); animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .note { color: var(--muted); font-size: 14px; min-height: 1.4em; }

  button.spin {
    margin-top: 22px; width: 100%; max-width: 520px;
    font-family: Oswald, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .08em;
    text-transform: uppercase; color: #1a1209;
    background: linear-gradient(180deg, #f2b552, var(--accent));
    border: 0; border-radius: 12px; padding: 18px; cursor: pointer;
    box-shadow: 0 6px 24px rgba(232,163,61,.25);
  }
  button.spin:active { transform: translateY(1px); }
  button.spin:disabled { opacity: .6; cursor: default; }

  footer { margin-top: auto; padding-top: 28px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>Dog's Dungeon<br><span>Fucker Upper</span></h1>
  </header>

  <div class="card" aria-live="polite">
    <div class="label">This run</div>
    <div class="result" id="result">Ready when you are</div>
    <div class="note" id="note">&nbsp;</div>
  </div>

  <button class="spin" id="spin">Run it</button>


  <footer>It won't roll the same modifier twice in a row.</footer>

<script>
const MODIFIERS = [
  { name: "Double Primary" },
  { name: "No Exotics" },
  { name: "Abilities only" },
  { name: "No Abilities" },
  { name: "Only use weapons you have no kills on" },
  { name: "Triple Shotgun" },
  { name: "Triple Bow" },
  { name: "Triple Sniper" },
  { name: "Muzz picks your Exotic Weapon" },
  { name: "Ty picks your subclass" },
  { name: "RanDIM Loadout" },
  { name: "Copy Ty's Loadout" },
  { name: "Use the build randomiser", link: "" } // paste your Build Randomiser URL here to make it a link
];


const resultEl = document.getElementById("result");
const noteEl = document.getElementById("note");
const spinBtn = document.getElementById("spin");
let last = null;


function rand(n) {
  const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n;
}

function spin() {
  const pool = MODIFIERS;
  let choices = pool.length > 1 ? pool.filter(m => m.name !== last) : pool;
  const pick = choices[rand(choices.length)];
  last = pick.name;

  spinBtn.disabled = true;
  noteEl.innerHTML = "&nbsp;";
  resultEl.className = "result spinning";
  if (navigator.vibrate) navigator.vibrate(20);

  let i = rand(pool.length), delay = 45;
  const tick = () => {
    resultEl.textContent = pool[i++ % pool.length].name;
    delay *= 1.12;
    if (delay < 380) setTimeout(tick, delay);
    else land(pick);
  };
  tick();
}

function land(pick) {
  resultEl.textContent = pick.name;
  resultEl.className = "result landed";
  if (pick.link) noteEl.innerHTML = `<a href="${pick.link}" target="_blank" rel="noopener" style="color:var(--accent)">Open the build randomiser →</a>`;
  else noteEl.textContent = "Good luck.";
  if (navigator.vibrate) navigator.vibrate([40, 40, 80]);
  spinBtn.disabled = false;
}

spinBtn.onclick = spin;

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
